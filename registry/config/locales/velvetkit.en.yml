# Strings rendered by VelvetKit components. Translate by copying this file
# to velvetkit.<locale>.yml and changing the values, never the keys.
en:
  date:
    formats:
      # How DatePicker writes and reads a date: its placeholder, parse order
      # and separator all come from this one string. Change it per locale.
      typed: "%d/%m/%Y"
  ui:
    date_picker:
      open: 'Open the calendar'
      # `format` is a reserved I18n interpolation key, hence `pattern`.
      hint: 'Type the date as %{pattern}, or use the calendar'
      previous: 'Previous month'
      next: 'Next month'
    chart:
      label: 'Chart'
      keyboard: 'Use the arrow keys to read each value.'
      show_data: 'Show the data'
      category: 'Category'
      missing: '—'
      total: 'Total'
      share: 'Share'
    confirm_dialog:
      confirm: 'Confirm'
      cancel: 'Cancel'
    data_grid:
      empty: 'Nothing to show'
    breadcrumb:
      label: 'Breadcrumb'
      ellipsis_label: 'More breadcrumb pages'
      collapsed_pages_label: 'Collapsed breadcrumb pages'
    alert:
      close_label: 'Close alert'
    button:
      loading: 'Loading, please wait'
    spinner:
      label: 'Loading'
    dialog:
      close_label: 'Close'
    number_input:
      decrement: 'Decrease'
      increment: 'Increase'
    password_input:
      show: 'Show password'
      hide: 'Hide password'
    sidebar:
      toggle: 'Toggle sidebar'
    table_of_contents:
      label: 'On this page'
    navigation_menu:
      label: 'Main'
    pagination:
      label: 'Pages'
      summary: 'Showing %{from}–%{to} of %{count}'
      previous: 'Go to previous page'
      previous_label: 'Previous'
      next: 'Go to next page'
      next_label: 'Next'
      more: 'More pages'
    stepper:
      label: 'Progress'
      complete: 'Completed'
      current: 'Current step'
      upcoming: 'Not started'
      error: 'Needs attention'
      loading: 'Checking'
      summary: 'Step %{current} of %{total}'
    select:
      placeholder: 'Choose…'
      search: 'Search'
      search_label: 'Search the options'
      no_matches: 'No matches'
      # Shown on a multiple select once more than two options are ticked.
      selected: '%{count} selected'
    session_tabs:
      label: 'Open tabs'
      add: 'New tab'
      options: 'Tab options'
      rename: 'Rename'
      rename_label: 'Tab name'
      duplicate: 'Duplicate'
      move_left: 'Move left'
      move_right: 'Move right'
      close: 'Close'
      confirm_close:
        title: 'Close this tab?'
        cancel: 'Keep it open'
        confirm: 'Close tab'
    theme_toggle:
      label: 'Change theme'
      heading: 'Theme'
      options:
        light: 'Light'
        dark: 'Dark'
        system: 'System'
    timeline:
      label: 'Timeline'
      complete: 'Completed'
      current: 'In progress'
      upcoming: 'Not started'
      error: 'Failed'
    toast:
      close_label: 'Dismiss'
    gallery:
      label: 'Image gallery'
      roledescription: 'gallery'
      dialog: 'Zoomed image'
      previous: 'Previous image'
      next: 'Next image'
      close: 'Close'
      zoom: 'Zoom image %{current}: %{alt}'
      zoom_in: 'Zoom in'
      zoom_out: 'Zoom out'
      thumbnail: 'Show image %{current}'
      position: 'Image %{current} of %{total}'
    file_field:
      browse: 'Click to upload'
      drop: 'or drag and drop'
