# Every icon the components and their previews draw, by its Lucide name,
# with its name in each other library. `velvetkit:add` renames the icons in
# what it copies for the library in config/velvetkit.yml, and copies the
# SVGs from icons/<library>/. After changing this file run `rake icons:sync`.
#
# test/velvetkit/icons_test.rb fails when a component draws an icon that
# isn't listed here, or a listed icon has no SVG.

