# The VelvetKit catalog.
#
# Only what the source files cannot say lives here. Which files make up a
# component, which other components it renders, and which Stimulus controllers
# and npm packages it needs are all read from the files themselves by
# Velvetkit::Registry, so they cannot drift out of date.

# Versions of the npm packages the components import.
packages:
  "@floating-ui/dom": "^1.7.4"
  "@hotwired/stimulus": "^3.2.2"
  "@rails/activestorage": "^8.1.4"
  ag-grid-community: "^36.1.0"
  chart.js: "^4.6.1"
  tw-animate-css: "^1.4.0"
  vanilla-calendar-pro: "^3.4.0"

# Versions of the gems a component needs beyond view_component and tailwind_merge.
gems:
  pagy: "~> 43.0"

components:
  accordion:
    description: Sections that expand and collapse, one at a time or several.
  alert:
    description: A highlighted message, optionally dismissible.
  avatar:
    description: A person's picture, with initials when there is none.
  avatar_group:
    description: Overlapping avatars with a "+N" count for the rest.
  badge:
    description: A small status label.
  banner:
    description: A dismissible strip across the top of a page.
  base:
    description: The base class every component inherits — variants and class merging.
  breadcrumb:
    description: The path to the current page, collapsing long trails.
  button:
    description: Buttons in every variant and size, with icons and a loading state.
  button_to:
    description: A button that submits a one-off form, like Rails' button_to.
  card:
    description: A bordered container with header, content and footer.
  chart:
    description: Line and bar charts, with a legend, tooltips and the numbers as a table, on Chart.js.
  checkbox:
    description: A checkbox with label, standalone or bound to a form builder.
  collapsible:
    description: A section that opens and closes under its trigger, like a branch of a nav tree.
  confirm_dialog:
    description: A styled dialog that answers data-turbo-confirm, in place of the browser's confirm box.
  data_grid:
    description: A sortable, filterable, server-paged table on AG Grid.
  date_picker:
    description: A typed date, or a range of two with presets, with a calendar under it, on Vanilla Calendar Pro.
  dialog:
    description: A modal dialog on the native <dialog> element.
  divider:
    description: A horizontal or vertical rule, optionally labelled.
  empty_state:
    description: What a page shows when it has nothing to list yet, with a way to add the first thing.
  file_field:
    description: A drag-and-drop file picker with previews, and direct upload to storage, standalone or with a form builder.
  form_field:
    description: A label, hint and error message wired to any form control.
  gallery:
    description: A product's photos, with thumbnails, swiping, and a full-screen view to zoom in.
  icon:
    description: An SVG icon from your chosen icon library, drawn inline on the server.
  image:
    description: An image with consistent sizing and corner radius.
  input:
    description: A text field with label, hint and error message, standalone or with a form builder.
  input_group:
    description: A text field with addons before or after it.
  label:
    description: A form label with a required marker.
  link:
    description: A link styled as text or as a button.
  menu:
    description: A dropdown menu with keyboard navigation.
  navigation_menu:
    description: Site navigation with links and hover or click panels of rich links.
  number_input:
    description: A number field with - and + buttons that keep counting while held.
  pagination:
    description: Page links for a long list, from a Pagy object.
    gems: [pagy]
  password_input:
    description: A password field with a show/hide toggle.
  popover:
    description: Floating content anchored to a trigger.
  progress:
    description: A bar showing how far along a task is, or that it's still going.
  radio_group:
    description: A set of radio buttons.
  native_select:
    description: The browser's own select, styled closed; best for phones' system pickers.
  select:
    description: A styled dropdown with keyboard navigation and type-ahead, posting like a native select.
  session_tabs:
    description: Browser-style tabs the user opens, renames, duplicates, reorders and closes.
  sheet:
    description: A panel that slides in from an edge of the screen.
  sidebar:
    description: A collapsible application sidebar with groups and menus.
  skeleton:
    description: A pulsing placeholder shown in a piece of content's shape while it loads.
  spinner:
    description: A loading indicator.
  stepper:
    description: The steps of a multi-step form, each one done, current or still to come.
  switch:
    description: An on/off toggle.
  table:
    description: A styled table with header, rows and caption.
  table_of_contents:
    description: An "On this page" list that follows the reader's scroll.
  tabs:
    description: Tabbed panels with keyboard navigation.
  text:
    description: Body text in set sizes, weights and tones.
  textarea:
    description: A multi-line text field with label, hint and error, that can grow with its text.
  theme_toggle:
    description: A light/dark/system theme switcher.
    files:
      - app/views/layouts/_theme_script.html.erb
  timeline:
    description: What happened and what's still to come, as a list of dated entries.
  toast:
    description: A stacked, auto-dismissing message, pushed from the client or a Turbo Stream.
  toggle_group:
    description: A row of buttons where one or several are chosen, posting like radios or checkboxes.
  tooltip:
    description: A hint shown on hover and focus.
  typography:
    description: Headings, lead, muted, code and blockquote text styles.
